packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - tools/upstream-preflight
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
dedupePeerDependents: false
injectWorkspacePackages: true
overrides:
  canvas: 3.2.3
  sharp: ^0.34.5
  dompurify: ^3.4.17
  follow-redirects: ^1.16.2
  joi: ^17.13.9
  proxy-addr: ^2.0.8
  shell-quote: ^1.11.0
  systeminformation: ^5.33.16
  'undici@6': ^6.29.1
  'undici@8': ^8.12.2
  'tar@7': ^7.5.19
packageExtensions:
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
patchedDependencies:
  '@immich/ui@0.83.0': patches/@immich__ui@0.83.0.patch
preferWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui@0.83.0'
